<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="loginGrad" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="50%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <pattern id="labGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" stroke="#bfdbfe" stroke-width="0.9" opacity="0.5" />
    </pattern>
  </defs>

  <!-- Base Blue & White Background -->
  <rect width="1440" height="900" fill="url(#loginGrad)" />
  <rect width="1440" height="900" fill="url(#labGrid)" />

  <!-- Soft Decorative Blue Glows -->
  <circle cx="210" cy="200" r="240" fill="#dbeafe" opacity="0.55" />
  <circle cx="1240" cy="700" r="280" fill="#bfdbfe" opacity="0.45" />

  <!-- Digital Network Nodes & Circuit Lines (Top & Sides) -->
  <g stroke="#3b82f6" stroke-width="1.6" opacity="0.32">
    <line x1="90" y1="140" x2="250" y2="95" />
    <line x1="250" y1="95" x2="410" y2="175" />
    <line x1="90" y1="140" x2="180" y2="290" />
    <line x1="180" y1="290" x2="410" y2="175" />
    <line x1="1030" y1="120" x2="1190" y2="210" />
    <line x1="1190" y1="210" x2="1340" y2="130" />
    <line x1="1190" y1="210" x2="1280" y2="350" />
    <line x1="1030" y1="120" x2="960" y2="250" />
  </g>
  <g fill="#2563eb" opacity="0.4">
    <circle cx="90" cy="140" r="5" />
    <circle cx="250" cy="95" r="6" />
    <circle cx="410" cy="175" r="5" />
    <circle cx="180" cy="290" r="5" />
    <circle cx="1030" cy="120" r="5" />
    <circle cx="1190" cy="210" r="6" />
    <circle cx="1340" cy="130" r="5" />
    <circle cx="1280" cy="350" r="4.5" />
    <circle cx="960" cy="250" r="4.5" />
  </g>

  <!-- Modern Computer Lab Workstations (Left Side Silhouette) -->
  <g transform="translate(65, 520)" opacity="0.45">
    <!-- Desk -->
    <rect x="0" y="210" width="380" height="14" rx="7" fill="#93c5fd" />
    <rect x="30" y="224" width="14" height="110" rx="4" fill="#bfdbfe" />
    <rect x="336" y="224" width="14" height="110" rx="4" fill="#bfdbfe" />

    <!-- Lab Monitor 1 -->
    <rect x="30" y="45" width="165" height="112" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" />
    <rect x="40" y="55" width="145" height="92" rx="5" fill="#eff6ff" />
    <rect x="102" y="157" width="22" height="36" fill="#93c5fd" />
    <rect x="78" y="193" width="70" height="8" rx="4" fill="#60a5fa" />
    <!-- Code lines on Lab Monitor 1 -->
    <line x1="54" y1="74" x2="115" y2="74" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" />
    <line x1="54" y1="90" x2="155" y2="90" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    <line x1="68" y1="106" x2="145" y2="106" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />
    <line x1="54" y1="122" x2="128" y2="122" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />

    <!-- Lab Monitor 2 -->
    <rect x="215" y="60" width="145" height="98" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2.2" />
    <rect x="224" y="69" width="127" height="80" rx="5" fill="#eff6ff" />
    <rect x="278" y="158" width="18" height="35" fill="#bfdbfe" />
    <rect x="256" y="193" width="62" height="8" rx="4" fill="#93c5fd" />
    <line x1="238" y1="88" x2="305" y2="88" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <line x1="238" y1="104" x2="328" y2="104" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />
    <line x1="238" y1="120" x2="292" y2="120" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Right Side: Modern Laptop with Coding Screen + Clean Unlabelled Books Beside It -->
  <g transform="translate(930, 490)" opacity="0.62">
    <!-- Desk Surface -->
    <rect x="0" y="258" width="460" height="14" rx="7" fill="#93c5fd" />

    <!-- Laptop with Coding Screen -->
    <g transform="translate(20, 40)">
      <rect x="25" y="0" width="250" height="175" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
      <rect x="37" y="12" width="226" height="151" rx="6" fill="url(#screenGrad)" />
      <!-- Window Dots -->
      <circle cx="52" cy="26" r="3.5" fill="#93c5fd" />
      <circle cx="64" cy="26" r="3.5" fill="#60a5fa" />
      <circle cx="76" cy="26" r="3.5" fill="#bfdbfe" />
      <!-- Coding Screen Lines -->
      <text x="50" y="54" font-family="monospace" font-size="15" font-weight="700" fill="#93c5fd">&lt;/&gt;</text>
      <line x1="50" y1="72" x2="145" y2="72" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
      <line x1="66" y1="90" x2="215" y2="90" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round" />
      <line x1="66" y1="108" x2="195" y2="108" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" />
      <line x1="50" y1="126" x2="160" y2="126" stroke="#bfdbfe" stroke-width="3.5" stroke-linecap="round" />
      <line x1="50" y1="144" x2="225" y2="144" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round" />
      <!-- Laptop Base -->
      <path d="M 4 178 H 296 L 316 204 H -16 L 4 178 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" />
      <rect x="115" y="186" width="70" height="6" rx="3" fill="#3b82f6" />
    </g>

    <!-- Stack of Books Beside the Laptop (Clean Covers, Zero Text/Tech Names) -->
    <g transform="translate(332, 162)">
      <!-- Bottom Book -->
      <rect x="0" y="64" width="108" height="28" rx="4" fill="#1d4ed8" stroke="#1e40af" stroke-width="2" />
      <rect x="8" y="70" width="90" height="16" rx="2" fill="#ffffff" opacity="0.9" />
      <rect x="0" y="64" width="14" height="28" rx="3" fill="#2563eb" />

      <!-- Middle Book -->
      <rect x="6" y="34" width="98" height="28" rx="4" fill="#3b82f6" stroke="#2563eb" stroke-width="2" />
      <rect x="14" y="40" width="80" height="16" rx="2" fill="#eff6ff" opacity="0.95" />
      <rect x="6" y="34" width="14" height="28" rx="3" fill="#1d4ed8" />

      <!-- Top Book -->
      <rect x="12" y="4" width="88" height="28" rx="4" fill="#60a5fa" stroke="#3b82f6" stroke-width="2" />
      <rect x="20" y="10" width="70" height="16" rx="2" fill="#ffffff" opacity="0.95" />
      <rect x="12" y="4" width="14" height="28" rx="3" fill="#2563eb" />
      <!-- Subtle Bookmark Ribbon -->
      <path d="M 82 4 V 44 L 87 39 L 92 44 V 4 Z" fill="#1e40af" />
    </g>
  </g>

  <!-- Subtle Floating Tech Symbols -->
  <g font-family="monospace" font-weight="700" fill="#2563eb" opacity="0.24">
    <text x="275" y="255" font-size="30">&lt;/&gt;</text>
    <text x="1150" y="295" font-size="28">{ }</text>
    <text x="190" y="440" font-size="24">( ) =&gt;</text>
  </g>
</svg>
