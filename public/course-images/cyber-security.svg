<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="cyber-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg-cyber)"/>

  <!-- Glowing Grid and Matrix Dots -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- Glowing Circles -->
  <circle cx="320" cy="140" r="110" fill="#0284c7" opacity="0.15"/>
  <circle cx="320" cy="140" r="85" fill="#2563eb" opacity="0.2"/>

  <!-- Central Shield & Padlock Illustration -->
  <g filter="url(#cyber-shadow)">
    <!-- Cyber Shield Outer -->
    <path d="M 320 45 L 420 90 L 420 160 C 420 220, 320 255, 320 255 C 320 255, 220 220, 220 160 L 220 90 Z" fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="3"/>

    <!-- Inner Shield Inset -->
    <path d="M 320 62 L 402 99 L 402 155 C 402 205, 320 236, 320 236 C 320 236, 238 205, 238 155 L 238 99 Z" fill="#0f172a" opacity="0.85"/>

    <!-- Padlock Icon -->
    <rect x="296" y="135" width="48" height="42" rx="8" fill="#38bdf8"/>
    <!-- Padlock Shackle -->
    <path d="M 305 135 L 305 118 C 305 110, 335 110, 335 118 L 335 135" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="320" cy="152" r="4.5" fill="#0f172a"/>
    <polygon points="318,154 322,154 324,166 316,166" fill="#0f172a"/>

    <!-- Binary Code Floating Elements -->
    <text x="145" y="120" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8" opacity="0.7">01101001</text>
    <text x="145" y="150" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8" opacity="0.5">11010010</text>
    <text x="440" y="120" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8" opacity="0.7">SECURE</text>
    <text x="440" y="150" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8" opacity="0.5">SSL / TLS</text>
  </g>

  <!-- Title Badge -->
  <g filter="url(#cyber-shadow)">
    <rect x="40" y="278" width="560" height="58" rx="14" fill="#020617" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Cyber Security</text>
    <text x="360" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Network Defense &amp; Safety</text>
    <text x="360" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">Ethical Hacking Basics • Password Security • Safe Browsing</text>
  </g>
</svg>