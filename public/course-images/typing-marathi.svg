<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-marathi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="marathi-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#431407" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg-marathi)"/>

  <!-- Decorative circles -->
  <circle cx="550" cy="80" r="130" fill="#fed7aa" opacity="0.2"/>
  <circle cx="80" cy="270" r="100" fill="#c2410c" opacity="0.3"/>

  <!-- Central Keyboard & Marathi Character Illustration -->
  <g filter="url(#marathi-shadow)">
    <!-- Keyboard Base -->
    <rect x="150" y="55" width="340" height="190" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>

    <!-- Prominent Marathi Glyph Character Key -->
    <rect x="180" y="80" width="75" height="75" rx="12" fill="#ea580c"/>
    <text x="217" y="132" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">क</text>

    <!-- Speedometer Gauge Card -->
    <rect x="275" y="80" width="185" height="75" rx="12" fill="#27272a"/>
    <text x="295" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fdba74">TYPING SPEED</text>
    <text x="295" y="138" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">30 / 40</text>
    <text x="390" y="138" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f97316">WPM</text>

    <!-- Keyboard Keys Row -->
    <g fill="#3f3f46" stroke="#52525b" stroke-width="1">
      <rect x="180" y="170" width="36" height="30" rx="6"/>
      <rect x="224" y="170" width="36" height="30" rx="6"/>
      <rect x="268" y="170" width="36" height="30" rx="6"/>
      <rect x="312" y="170" width="36" height="30" rx="6"/>
      <rect x="356" y="170" width="36" height="30" rx="6"/>
      <rect x="400" y="170" width="60" height="30" rx="6" fill="#ea580c" stroke="#f97316"/>
    </g>
    <!-- Spacebar Row -->
    <g fill="#3f3f46" stroke="#52525b" stroke-width="1">
      <rect x="180" y="206" width="50" height="26" rx="5"/>
      <rect x="238" y="206" width="160" height="26" rx="5"/>
      <rect x="406" y="206" width="54" height="26" rx="5"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g filter="url(#marathi-shadow)">
    <rect x="40" y="278" width="560" height="58" rx="14" fill="#431407" fill-opacity="0.9" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="65" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Typing - Marathi</text>
    <text x="360" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#fdba74">GCC-TBC Govt. Certified</text>
    <text x="360" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#ffedd5">30 WPM &amp; 40 WPM • Keyboard Speed • Letter &amp; Statement</text>
  </g>
</svg>