<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-tally" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="tally-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg-tally)"/>

  <!-- Decorative Chart Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <path d="M 0 260 Q 160 140, 320 200 T 640 100" fill="none"/>
    <path d="M 0 290 Q 200 200, 400 240 T 640 140" fill="none"/>
  </g>
  <circle cx="560" cy="70" r="130" fill="#6ee7b7" opacity="0.2"/>
  <circle cx="70" cy="270" r="100" fill="#047857" opacity="0.3"/>

  <!-- Central Illustration: Tally Accounting UI & Ledger -->
  <g filter="url(#tally-shadow)">
    <!-- Main Ledger Card -->
    <rect x="180" y="45" width="280" height="200" rx="14" fill="#ffffff"/>
    <rect x="180" y="45" width="280" height="42" rx="14" fill="#047857"/>
    <rect x="180" y="75" width="280" height="12" fill="#047857"/>
    <text x="200" y="72" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">TallyPrime ERP</text>
    <rect x="385" y="58" width="60" height="18" rx="4" fill="#10b981"/>
    <text x="396" y="71" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">GST Ready</text>

    <!-- Table Columns -->
    <rect x="200" y="105" width="120" height="14" rx="3" fill="#e2e8f0"/>
    <rect x="340" y="105" width="50" height="14" rx="3" fill="#dcfce7"/>
    <rect x="400" y="105" width="45" height="14" rx="3" fill="#dcfce7"/>

    <rect x="200" y="128" width="100" height="10" rx="2" fill="#f1f5f9"/>
    <rect x="340" y="128" width="45" height="10" rx="2" fill="#f1f5f9"/>
    <rect x="400" y="128" width="40" height="10" rx="2" fill="#f1f5f9"/>

    <rect x="200" y="146" width="115" height="10" rx="2" fill="#f1f5f9"/>
    <rect x="340" y="146" width="40" height="10" rx="2" fill="#f1f5f9"/>
    <rect x="400" y="146" width="45" height="10" rx="2" fill="#f1f5f9"/>

    <rect x="200" y="164" width="85" height="10" rx="2" fill="#f1f5f9"/>
    <rect x="340" y="164" width="50" height="10" rx="2" fill="#f1f5f9"/>
    <rect x="400" y="164" width="38" height="10" rx="2" fill="#f1f5f9"/>

    <!-- Total Row -->
    <rect x="200" y="195" width="245" height="2" fill="#cbd5e1"/>
    <text x="200" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Net Profit (₹)</text>
    <text x="365" y="222" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#059669">₹ 1,48,500</text>
  </g>

  <!-- Floating Calculator Icon Badge -->
  <g filter="url(#tally-shadow)">
    <circle cx="150" cy="120" r="34" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect x="135" y="102" width="30" height="36" rx="5" fill="#334155"/>
    <rect x="139" y="106" width="22" height="8" rx="2" fill="#6ee7b7"/>
    <circle cx="142" cy="120" r="2" fill="#ffffff"/>
    <circle cx="150" cy="120" r="2" fill="#ffffff"/>
    <circle cx="158" cy="120" r="2" fill="#ffffff"/>
    <circle cx="142" cy="128" r="2" fill="#ffffff"/>
    <circle cx="150" cy="128" r="2" fill="#ffffff"/>
    <circle cx="158" cy="128" r="2" fill="#ffffff"/>
  </g>

  <!-- Title Badge -->
  <g filter="url(#tally-shadow)">
    <rect x="40" y="278" width="560" height="58" rx="14" fill="#064e3b" fill-opacity="0.9" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="65" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Tally Prime with GST</text>
    <text x="360" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Accounting &amp; Taxation</text>
    <text x="360" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#a7f3d0">Voucher Entry • Invoicing • GST Reports • Balance Sheet</text>
  </g>
</svg>