<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mscit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg-mscit)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Decorative Glow Circles -->
  <circle cx="530" cy="80" r="140" fill="#60a5fa" opacity="0.25"/>
  <circle cx="90" cy="290" r="110" fill="#0284c7" opacity="0.3"/>

  <!-- Laptop Illustration -->
  <g filter="url(#shadow)">
    <!-- Laptop Screen Outer -->
    <rect x="180" y="55" width="280" height="180" rx="14" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- Screen Inner Display -->
    <rect x="194" y="69" width="252" height="152" rx="6" fill="#1e293b"/>
    <!-- Window Bar -->
    <rect x="194" y="69" width="252" height="22" rx="4" fill="#0f172a"/>
    <circle cx="208" cy="80" r="4" fill="#ef4444"/>
    <circle cx="220" cy="80" r="4" fill="#f59e0b"/>
    <circle cx="232" cy="80" r="4" fill="#10b981"/>
    
    <!-- Screen Content: Windows / Office Desktop UI -->
    <!-- App Windows -->
    <rect x="206" y="100" width="105" height="68" rx="6" fill="#1d4ed8" opacity="0.85"/>
    <rect x="214" y="108" width="40" height="8" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="214" y="122" width="85" height="5" rx="2" fill="#93c5fd"/>
    <rect x="214" y="132" width="70" height="5" rx="2" fill="#93c5fd"/>
    <rect x="214" y="142" width="60" height="5" rx="2" fill="#93c5fd"/>

    <!-- Excel / Word sheet preview -->
    <rect x="323" y="100" width="110" height="108" rx="6" fill="#ffffff" opacity="0.95"/>
    <rect x="323" y="100" width="110" height="20" rx="4" fill="#2563eb"/>
    <text x="333" y="114" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ffffff">MS Office 365</text>
    <rect x="333" y="128" width="35" height="8" rx="2" fill="#10b981"/>
    <rect x="373" y="128" width="50" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="333" y="142" width="90" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="333" y="152" width="80" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="333" y="162" width="85" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="333" y="172" width="65" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="333" y="182" width="75" height="5" rx="2" fill="#cbd5e1"/>

    <!-- Laptop Base -->
    <path d="M 140 235 L 500 235 L 525 248 C 525 254, 518 258, 508 258 L 132 258 C 122 258, 115 254, 115 248 Z" fill="#94a3b8"/>
    <!-- Touchpad -->
    <rect x="285" y="240" width="70" height="12" rx="3" fill="#cbd5e1"/>
  </g>

  <!-- Title Badge / Overlay -->
  <g filter="url(#shadow)">
    <rect x="40" y="278" width="560" height="58" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">MS-CIT</text>
    <text x="175" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Maharashtra State Certificate in IT</text>
    <text x="175" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Computer Fundamentals • Windows 11 • MS Office • Internet Skills</text>
    <!-- Verified Badge -->
    <rect x="510" y="291" width="72" height="30" rx="8" fill="#2563eb"/>
    <text x="526" y="311" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">MKCL</text>
  </g>
</svg>
