<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-data" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="data-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0c4a6e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg-data)"/>

  <circle cx="560" cy="80" r="130" fill="#bae6fd" opacity="0.2"/>
  <circle cx="80" cy="270" r="100" fill="#0369a1" opacity="0.3"/>

  <!-- Data Entry Graphic: Database, Spreadsheet, Form Processing -->
  <g filter="url(#data-shadow)">
    <!-- Base Card -->
    <rect x="160" y="50" width="320" height="195" rx="14" fill="#ffffff"/>
    <rect x="160" y="50" width="320" height="40" rx="14" fill="#0284c7"/>
    <rect x="160" y="76" width="320" height="14" fill="#0284c7"/>
    <text x="180" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Data Entry Operator System</text>

    <!-- Spreadsheet Columns -->
    <g fill="#f0f9ff" stroke="#bae6fd" stroke-width="1">
      <rect x="180" y="105" width="85" height="24" rx="4"/>
      <rect x="272" y="105" width="85" height="24" rx="4"/>
      <rect x="364" y="105" width="95" height="24" rx="4"/>

      <rect x="180" y="136" width="85" height="20" rx="3"/>
      <rect x="272" y="136" width="85" height="20" rx="3"/>
      <rect x="364" y="136" width="95" height="20" rx="3"/>

      <rect x="180" y="162" width="85" height="20" rx="3"/>
      <rect x="272" y="162" width="85" height="20" rx="3"/>
      <rect x="364" y="162" width="95" height="20" rx="3"/>

      <rect x="180" y="188" width="85" height="20" rx="3"/>
      <rect x="272" y="188" width="85" height="20" rx="3"/>
      <rect x="364" y="188" width="95" height="20" rx="3"/>
    </g>

    <!-- Checkmarks / Verification icons -->
    <circle cx="445" cy="146" r="6" fill="#10b981"/>
    <circle cx="445" cy="172" r="6" fill="#10b981"/>
    <circle cx="445" cy="198" r="6" fill="#10b981"/>
  </g>

  <!-- Title Badge -->
  <g filter="url(#data-shadow)">
    <rect x="40" y="278" width="560" height="58" rx="14" fill="#082f49" fill-opacity="0.9" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="65" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Data Entry Operator</text>
    <text x="360" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">Office Automation &amp; MIS</text>
    <text x="360" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#e0f2fe">Speed Accuracy • Form Filling • Excel Data Processing</text>
  </g>
</svg>