<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-english" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="eng-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2e1065" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg-english)"/>

  <!-- Decorative circles -->
  <circle cx="560" cy="80" r="130" fill="#e9d5ff" opacity="0.2"/>
  <circle cx="80" cy="270" r="100" fill="#6b21a8" opacity="0.3"/>

  <!-- Central Keyboard & English Typing Illustration -->
  <g filter="url(#eng-shadow)">
    <!-- Keyboard Base -->
    <rect x="150" y="55" width="340" height="190" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>

    <!-- Prominent English Keys A-S-D-F -->
    <g fill="#27272a" stroke="#7c3aed" stroke-width="2">
      <rect x="180" y="80" width="60" height="60" rx="10"/>
      <text x="210" y="122" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>

      <rect x="250" y="80" width="60" height="60" rx="10"/>
      <text x="280" y="122" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
    </g>

    <!-- Speed Meter Box -->
    <rect x="325" y="80" width="135" height="60" rx="10" fill="#6b21a8"/>
    <text x="340" y="103" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#e9d5ff">ACCURACY &amp; SPEED</text>
    <text x="340" y="128" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">40 WPM</text>
    <text x="424" y="128" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">99%</text>

    <!-- Full Keys Row -->
    <g fill="#3f3f46" stroke="#52525b" stroke-width="1">
      <rect x="180" y="152" width="32" height="26" rx="5"/>
      <rect x="218" y="152" width="32" height="26" rx="5"/>
      <rect x="256" y="152" width="32" height="26" rx="5"/>
      <rect x="294" y="152" width="32" height="26" rx="5"/>
      <rect x="332" y="152" width="32" height="26" rx="5"/>
      <rect x="370" y="152" width="32" height="26" rx="5"/>
      <rect x="408" y="152" width="52" height="26" rx="5" fill="#7c3aed" stroke="#a855f7"/>
    </g>

    <!-- Spacebar Row -->
    <g fill="#3f3f46" stroke="#52525b" stroke-width="1">
      <rect x="180" y="186" width="45" height="26" rx="5"/>
      <rect x="233" y="186" width="170" height="26" rx="5"/>
      <rect x="411" y="186" width="49" height="26" rx="5"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g filter="url(#eng-shadow)">
    <rect x="40" y="278" width="560" height="58" rx="14" fill="#2e1065" fill-opacity="0.9" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="65" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Typing - English</text>
    <text x="360" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#d8b4fe">GCC-TBC Govt. Certified</text>
    <text x="360" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#f3e8ff">30 WPM &amp; 40 WPM • Touch Typing • Speed &amp; Accuracy Training</text>
  </g>
</svg>