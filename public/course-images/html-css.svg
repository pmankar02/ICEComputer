<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-html" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="html-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#450a0a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg-html)"/>

  <circle cx="560" cy="80" r="130" fill="#fca5a5" opacity="0.2"/>
  <circle cx="80" cy="270" r="100" fill="#b91c1c" opacity="0.3"/>

  <!-- Code Editor & Responsive Browser Mockup -->
  <g filter="url(#html-shadow)">
    <!-- Code Editor Window -->
    <rect x="160" y="50" width="320" height="195" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Window Bar -->
    <rect x="160" y="50" width="320" height="28" rx="14" fill="#1e293b"/>
    <circle cx="178" cy="64" r="4.5" fill="#ef4444"/>
    <circle cx="192" cy="64" r="4.5" fill="#f59e0b"/>
    <circle cx="206" cy="64" r="4.5" fill="#10b981"/>
    <text x="240" y="68" font-family="monospace" font-size="11" fill="#94a3b8">index.html &bull; style.css</text>

    <!-- Code Lines -->
    <text x="180" y="105" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#f43f5e">&lt;html&gt;</text>
    <text x="195" y="125" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8">&lt;header class=<tspan fill="#facc15">"navbar"</tspan>&gt;</text>
    <text x="210" y="145" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#34d399">&lt;h1&gt;<tspan fill="#ffffff">Web Design</tspan>&lt;/h1&gt;</text>
    <text x="195" y="165" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8">&lt;/header&gt;</text>
    <text x="195" y="185" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#c084fc">.container { <tspan fill="#60a5fa">display: flex;</tspan> }</text>
    <text x="180" y="205" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#f43f5e">&lt;/html&gt;</text>

    <!-- HTML5 & CSS3 Badges -->
    <rect x="375" y="90" width="85" height="40" rx="8" fill="#e44d26"/>
    <text x="417" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">HTML5</text>

    <rect x="375" y="140" width="85" height="40" rx="8" fill="#264de4"/>
    <text x="417" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">CSS3</text>
  </g>

  <!-- Title Badge -->
  <g filter="url(#html-shadow)">
    <rect x="40" y="278" width="560" height="58" rx="14" fill="#450a0a" fill-opacity="0.9" stroke="#fda4af" stroke-width="1.5"/>
    <text x="65" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">HTML &amp; CSS Web Design</text>
    <text x="370" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#fda4af">Frontend Development</text>
    <text x="370" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#ffe4e6">HTML5 • CSS3 • Flexbox &amp; Grid • Responsive Websites</text>
  </g>
</svg>